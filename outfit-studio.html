<style>
:root{--bg:#08080A;--surface:#121215;--surface2:#18181C;--surface3:#202024;--border:rgba(255,255,255,.07);--border-hi:rgba(255,255,255,.14);--text:#F2F0EC;--muted:#8B8892;--accent:#D9B876;--accent-2:#F0D9A0;--accent-dim:#B8965F;--accent-dim-bg:rgba(217,184,118,.12);--accent-text-on-dark:#E6CD97;--red:#F87171;--fs-xs:11.5px;--fs-xs2:12px;--fs-sm:12.5px;--fs-base:13.5px;--fs-md:14.5px;--fs-lg:17px;--fs-2xl:22px;--radius-md:8px;--radius-sm:10px;--radius:14px;--radius-lg:22px}

.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:46px;padding:0 16px;border-radius:var(--radius);border:1px solid #A98A52;background:#1E1911;color:var(--accent-text-on-dark);font-weight:500;cursor:pointer;text-decoration:none;transition:filter .15s}

.dz b{color:var(--text);font-weight:500}.dz small{font-size:var(--fs-xs2)}.dz.has{display:block;padding:0;min-height:0;border-style:solid}

.lnk{background:none;border:0;color:var(--accent);font-size:var(--fs-xs2);padding:10px 0 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.pr{margin:0 0 12px;font-size:var(--fs-sm);line-height:1.65;max-height:7.4em;overflow:auto;user-select:text}.row{display:flex;gap:8px}.hint{margin:10px 0 0;color:var(--muted);font-size:var(--fs-xs2)}
.empty{text-align:center;color:var(--muted);font-size:var(--fs-sm);line-height:1.65;padding:32px 12px}

.zr,.zl{touch-action:none}#pvchip{position:absolute;right:8px;bottom:8px;z-index:3;pointer-events:none}.pchip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border-radius:99px;background:rgba(8,8,10,.82);border:1px solid var(--border-hi);color:var(--text);font-size:var(--fs-xs2);font-weight:500;pointer-events:auto;cursor:pointer}.pchip.pc-h{pointer-events:none;color:var(--muted);cursor:default}
.spin{width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;flex:none}@keyframes sp{to{transform:rotate(360deg)}}.btn.busy:disabled{opacity:.9}
.tabs{display:flex;gap:4px;padding:4px;margin:4px 0 18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}.tab{flex:1;height:42px;border-radius:10px;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:var(--fs-sm);cursor:pointer}.tab.on{background:var(--accent-dim-bg);color:var(--accent-2);box-shadow:inset 0 0 0 1px rgba(217,184,118,.4)}
.lh{display:flex;align-items:baseline;justify-content:space-between}.lh .lb{margin-bottom:8px}.live{display:flex;align-items:center;gap:6px;font-size:var(--fs-xs2);color:#8FD1A1;margin-bottom:10px}.live i{width:7px;height:7px;border-radius:50%;background:#8FD1A1;flex:none}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}.sw small{display:block;color:var(--muted);font-size:var(--fs-xs2)}
.tg{width:44px;height:26px;border-radius:99px;border:1px solid var(--border-hi);background:var(--surface3);position:relative;flex:none;cursor:pointer;padding:0}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:.15s}.tg.on{background:var(--accent-dim-bg);border-color:var(--accent-dim)}.tg.on::after{left:20px;background:var(--accent)}

.mks,.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mk{display:flex;flex-direction:column;gap:3px;padding:10px;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:border-color .15s}.mk:hover,.mk:active{border-color:rgba(217,184,118,.4)}
.mkt{border-radius:var(--radius-md);overflow:hidden;margin-bottom:8px}.mk b{font-size:var(--fs-md);font-weight:600}.mk small{color:var(--muted);font-size:var(--fs-xs2);line-height:1.4}
.hd{display:flex;align-items:center;justify-content:space-between;margin:26px 0 10px}
.srch{position:relative;margin-bottom:12px}.srch svg{position:absolute;left:13px;top:14px;color:var(--muted)}.srch .inp{padding-left:38px}
.al{display:flex;flex-direction:column;gap:2px;padding:8px;text-align:left;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-md);cursor:pointer}
.al b{font-size:var(--fs-sm);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.al small{color:var(--muted);font-size:var(--fs-xs2)}
.cv{border-radius:6px;overflow:hidden;margin-bottom:6px;aspect-ratio:4/5;background:var(--surface3);display:grid;place-items:center;color:var(--muted)}
.pic{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden}.pic .tile{display:block;width:100%;padding:0;border:0;background:none;cursor:pointer}

#vw .vimg{flex:none;max-width:100%;max-height:calc(100dvh - 140px);object-fit:contain;border-radius:var(--radius-sm)}#vw .vmsg{margin:0;text-align:center}
.vdel{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:99px;border:1px solid rgba(248,113,113,.35);background:rgba(8,8,10,.7);color:var(--red);font-size:var(--fs-xs2);cursor:pointer}.vdel:active{transform:scale(.97)}
#sheet{position:absolute;inset:0;z-index:25;display:none;align-items:flex-end;background:rgba(0,0,0,.6)}#sheet.show{display:flex}
.sheet{width:100%;max-height:80%;overflow:auto;background:var(--surface);border-top:1px solid var(--border-hi);border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom))}.sheet h3{margin:0 0 10px;font-size:var(--fs-md);font-weight:600}

.mt{width:38px;aspect-ratio:4/5;border-radius:6px;overflow:hidden;background:var(--surface3);display:grid;place-items:center;color:var(--muted);flex:none}

.toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,8px);opacity:0;pointer-events:none;background:var(--surface3);border:1px solid var(--border-hi);border-radius:99px;padding:9px 16px;font-size:var(--fs-sm);z-index:40;transition:.2s;max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.toast.on{opacity:1;transform:translate(-50%,0)}
/* Gambar hasil (tiruan). Ukuran teks pakai cqw supaya skalanya ikut lebar kartu di mana pun dipakai */
.res{container-type:inline-size;aspect-ratio:4/5;width:100%;background:#fff;color:#1d1b19;border-radius:var(--radius-sm);overflow:hidden;display:grid;font-family:'Hanken Grotesk',sans-serif;line-height:1.15}

.ph{width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(155deg,hsl(var(--h) 26% 68%),hsl(calc(var(--h) + 26) 28% 46%));color:rgba(255,255,255,.75)}.ph svg{width:30%;height:auto;max-width:48px}

/* ===== Pintasan Album & Prompt Foto AI di layar Inspirasi/Rekomendasi (v14.96) ===== */
#bar #bk{flex:none}
