name: Hapus foto pratinjau (media/chN.webp)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "cek-saja = hanya daftar file; hapus = benar-benar menghapus"
        type: choice
        options: [cek-saja, hapus]
        default: cek-saja

permissions:
  contents: write

jobs:
  hapus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Daftar file yang cocok
        run: |
          find media -maxdepth 1 -type f -regextype posix-extended -regex 'media/ch[0-9]+(-v[0-9]+)?\.webp' | sort -V | tee /tmp/daftar.txt
          echo "Jumlah file cocok: $(wc -l < /tmp/daftar.txt)"
      - name: Hapus
        if: ${{ inputs.mode == 'hapus' }}
        run: |
          if [ ! -s /tmp/daftar.txt ]; then echo "Tidak ada file yang cocok."; exit 0; fi
          xargs -a /tmp/daftar.txt git rm -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Hapus foto pratinjau media/chN.webp"
          git push
